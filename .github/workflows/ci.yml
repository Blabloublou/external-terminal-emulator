name: CI

on:
  pull_request:
    branches: [main]

jobs:
  test:
    name: Run tests
    runs-on: ubuntu-latest
    container:
      image: gradle:8.5-jdk17
      options: --user root
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run tests
        run: gradle test --no-daemon
